[project]
name = "venturalitica-scenario-medical"
version = "0.5.0"
description = "Spine segmentation scenario: base ML vs governance-instrumented comparison"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "venturalitica[agentic]>=0.6.8",
    "streamlit>=1.57.0",
    "totalsegmentator>=2.13",
]

[project.optional-dependencies]
gpu = [
    "monai[all]>=1.2.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.21.0",
    "codecarbon>=2.2.0",
]
full = [
    "venturalitica-scenario-medical[gpu]",
]

# Resolve the SDK from the integration monorepo when this scenario is
# checked out as a submodule of venturalitica-integration. When the
# scenario is consumed standalone, drop this section and the published
# `venturalitica` package on PyPI is used.
[tool.uv.sources]
venturalitica = { path = "../packages/venturalitica-sdk", editable = true }
